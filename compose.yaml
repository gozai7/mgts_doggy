services:
  competition:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
        WITH_VIEWER: ${WITH_VIEWER:-OFF}
    image: mgts-competition-${COMPETITION_BACKEND:-local}:cpu
    init: true
    network_mode: none
    shm_size: 1gb
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-91}
      ROS_LOCALHOST_ONLY: '1'
      PYTHONUNBUFFERED: '1'
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
      - ${RESULTS_DIR:-./results}:/results
      - ./configs:/mgts/configs:ro
