services:
  sim:
    image: mgts-sim
    entrypoint: [/mgts/entrypoint, python3, /mgts/sim/capture.py]
    build: {context: ., dockerfile: Dockerfile.legacy, target: sim}
    init: true
    stop_grace_period: 30s
    environment:
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/mgts.xauth
      MGTS_HEADLESS: ${MGTS_HEADLESS:-0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/tmp/mgts.xauth:ro
      - ./data:/data
      - ./truth:/truth
  solve:
    image: mgts-solver
    build: {context: ., dockerfile: Dockerfile.legacy, target: solver}
    init: true
    network_mode: none
    entrypoint: [/mgts/entrypoint, python3, /mgts/solver/solve.py]
    volumes:
      - ./data:/data:ro
      - ./configs:/mgts/configs:ro
      - ./runs:/runs
  eval:
    image: mgts-solver
    network_mode: none
    entrypoint: [/mgts/entrypoint, python3, /mgts/solver/evaluate.py]
    volumes:
      - ./truth:/truth:ro
      - ./runs:/runs
