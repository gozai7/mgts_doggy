slam_toolbox:
  ros__parameters:
    use_sim_time: true
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 16.0
    minimum_time_interval: 0.0
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.08
    check_min_dist_and_heading_precisely: true
    map_update_interval: 0.5
    use_map_saver: false
