schema_version: 1
bags:
  mapping: /data/bag_for_mapping
  localization: /data/bag_for_localization
output: /results/go2-calibrated
topics:
  lidar: /utlidar/cloud
  imu: /utlidar/imu
  odometry: /utlidar/robot_odom
frames: {map: map, odom: odom, base: base_link, lidar: lidar, imu: imu}
source_frames: {lidar: utlidar_lidar, imu: utlidar_imu, odometry: odom, odometry_child: base_link}
extrinsics:
  # LiDAR mount recovered from cloud / cloud_base pairs.
  T_base_lidar: [0.2821600182, -0.0000000024, -0.0246700046, -0.0000000026, 0.9914583559, 0.0000000005, 0.1304236502]
  # IMU rotation fit against odometry angular velocity, nominal lever arm.
  T_base_imu: [0.2913211175, -0.0146550024, -0.0291222359, 0.8670298825, -0.4814377980, 0.1121755807, -0.0623976654]
units: {xyz: m, acceleration: m/s2, angular_velocity: rad/s}
point_time: {field: time, unit: s, mode: relative, offset_s: 0.0}
time_offsets_s: {lidar: 0.0, imu: 0.0, odometry: 0.0}
lidar: {scan_period_s: 0.072, range_m: [0.5, 20.0], intensity_field: intensity, body_box_base_m: null}
mapping:
  profile: default_indoor
  mode: cpu
  timeout_s: 7200
  min_trajectory_coverage: 0.75
  max_trajectory_step_m: 0.5
localization:
  prior_map: /results/go2-prior/map.pcd
  prior_trajectory: /results/go2-prior/trajectory.tum
  initial_pose: null
  manual_initial_pose: false
  prediction: kinematic
  use_odom_origin_hint: true
  registration_method: NDT_OMP
  ndt_resolution: 0.35
  score_threshold: 0.08
  voxel_leaf_size: 0.1
  deskew: false
  scan_timeout_s: 60.0
  initialization_timeout_s: 180.0
  min_accepted_fraction: 0.5
  registration_parameters:
    level_map_to_odom: true
    min_inlier_ratio: 0.55
    inlier_ratio_distance_m: 0.16
    inlier_ratio_min_points: 100
    enable_seed_correction_guard: true
    seed_correction_guard_translation_m: 0.13
    seed_correction_guard_yaw_deg: 5.0
    seed_correction_guard_warmup_accepts: 0
    seed_correction_guard_release_rejections: 10000
    enable_seed_correction_window_guard: true
    seed_correction_window_guard_translation_m: 0.17
occupancy:
  resolution_m: 0.05
  floor_z_m: -0.05
  height_m: [0.10, 1.80]
  angular_bins: 720
  every_n_scans: 2
  min_hit_scans: 2
  max_pose_gap_s: 0.5
  max_cells: 16000000
